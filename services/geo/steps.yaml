service: geo

vars:
  SERVICE_NAME: geo

# Path-scoped permissions. Framework-managed files (steps.yaml, SPEC.yaml,
# .runner/**) are auto-denied by the runner.
scope:
  - services/geo/**

steps:
  - id: scaffold_directories
    do: python3 framework/scripts/scaffold_from_spec services/geo/SPEC.yaml
    checks:
      - file_organization_matches_spec services/geo/SPEC.yaml

  - id: implement_service
    context:
      - services/geo/SPEC.yaml
    checks:
      - go_tests_pass services/geo
      - docker_runs services/geo
