service: admin

vars:
  SERVICE_NAME: admin

# Path-scoped permissions. Framework-managed files (steps.yaml, SPEC.yaml,
# .runner/**) are auto-denied by the runner.
scope:
  - services/admin/**

steps:
  - id: scaffold_directories
    do: python3 framework/scripts/scaffold_from_spec services/admin/SPEC.yaml
    checks:
      - file_organization_matches_spec services/admin/SPEC.yaml

  - id: implement_service
    context:
      - services/admin/SPEC.yaml
    checks:
      - go_tests_pass services/admin
      - docker_runs services/admin
