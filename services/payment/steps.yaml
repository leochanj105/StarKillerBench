service: payment

vars:
  SERVICE_NAME: payment

# Path-scoped permissions. Framework-managed files (steps.yaml, SPEC.yaml,
# .runner/**) are auto-denied by the runner.
scope:
  - services/payment/**

steps:
  # shell — create the directory layout declared in SPEC.yaml's
  # `file_organization`. The do command and the check both read SPEC.
  - id: scaffold_directories
    do: python3 framework/scripts/scaffold_from_spec services/payment/SPEC.yaml
    checks:
      - file_organization_matches_spec services/payment/SPEC.yaml

  # agent — implement the entire service from SPEC.yaml.
  # All verification (spec match, build, tests, container health) lives here
  # as checks; on any failure the agent retries with the failure log appended.
  - id: implement_service
    context:
      - services/payment/SPEC.yaml
    checks:
      # go_tests_pass covers compilation too — `go test ./...` builds every
      # package before running tests, so a redundant `go_builds` is dropped.
      - go_tests_pass services/payment
      - docker_runs services/payment
