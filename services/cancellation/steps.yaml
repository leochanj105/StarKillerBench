service: cancellation

vars:
  SERVICE_NAME: cancellation

scope:
  - services/cancellation/**

steps:
  - id: scaffold_directories
    do: python3 framework/scripts/scaffold_from_spec services/cancellation/SPEC.yaml
    checks:
      - file_organization_matches_spec services/cancellation/SPEC.yaml

  - id: implement_service
    context:
      - services/cancellation/SPEC.yaml
    checks:
      - go_tests_pass services/cancellation
      - docker_runs services/cancellation
