service: pricing

vars:
  SERVICE_NAME: pricing

# Path-scoped permissions. Framework-managed files (steps.yaml, SPEC.yaml,
# .runner/**) are auto-denied by the runner.
scope:
  - services/pricing/**

steps:
  - id: scaffold_directories
    do: python3 framework/scripts/scaffold_from_spec services/pricing/SPEC.yaml
    checks:
      - file_organization_matches_spec services/pricing/SPEC.yaml

  - id: implement_service
    context:
      - services/pricing/SPEC.yaml
    checks:
      - go_tests_pass services/pricing
      - docker_runs services/pricing
