service: notification

vars:
  SERVICE_NAME: notification

# Path-scoped permissions. Framework-managed files (steps.yaml, SPEC.yaml,
# .runner/**) are auto-denied by the runner.
scope:
  - services/notification/**

steps:
  - id: scaffold_directories
    do: python3 framework/scripts/scaffold_from_spec services/notification/SPEC.yaml
    checks:
      - file_organization_matches_spec services/notification/SPEC.yaml

  - id: implement_service
    context:
      - services/notification/SPEC.yaml
    checks:
      - go_tests_pass services/notification
      - docker_runs services/notification
