service: inventory

vars:
  SERVICE_NAME: inventory

scope:
  - services/inventory/**

steps:
  - id: scaffold_directories
    do: python3 framework/scripts/scaffold_from_spec services/inventory/SPEC.yaml
    checks:
      - file_organization_matches_spec services/inventory/SPEC.yaml

  - id: implement_service
    context:
      - services/inventory/SPEC.yaml
    checks:
      - go_tests_pass services/inventory
      - docker_runs services/inventory
