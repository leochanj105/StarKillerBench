service: profile

vars:
  SERVICE_NAME: profile

# Path-scoped permissions. Framework-managed files (steps.yaml, SPEC.yaml,
# .runner/**) are auto-denied by the runner.
scope:
  - services/profile/**

steps:
  - id: scaffold_directories
    do: python3 framework/scripts/scaffold_from_spec services/profile/SPEC.yaml
    checks:
      - file_organization_matches_spec services/profile/SPEC.yaml

  - id: implement_service
    context:
      - services/profile/SPEC.yaml
    checks:
      - go_tests_pass services/profile
      - docker_runs services/profile
