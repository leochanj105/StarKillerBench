syntax = "proto3";

package review.v1;

option go_package = "agentbench/services/review/api/v1;reviewv1";

// ReviewService stores hotel reviews, serves them paginated, and computes a
// per-hotel rating aggregate on demand.
service ReviewService {
  // Appends a review for a hotel and returns its generated review_id.
  rpc PostReview(PostReviewRequest) returns (PostReviewResponse);

  // Returns one page of a hotel's reviews (page is 1-based) plus the total
  // review count for the hotel.
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);

  // Returns the number of reviews and their mean rating for the hotel.
  rpc GetAggregate(GetAggregateRequest) returns (GetAggregateResponse);
}

message Review {
  string review_id = 1;
  string hotel_id = 2;
  string user_id = 3;
  int32 rating = 4;
  string text = 5;
}

message PostReviewRequest {
  string hotel_id = 1;
  string user_id = 2;
  int32 rating = 3;
  string text = 4;
}

message PostReviewResponse {
  string review_id = 1;
}

message ListReviewsRequest {
  string hotel_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListReviewsResponse {
  repeated Review reviews = 1;
  int32 total_count = 2;
}

message GetAggregateRequest {
  string hotel_id = 1;
}

message GetAggregateResponse {
  int32 review_count = 1;
  double avg_rating = 2;
}
