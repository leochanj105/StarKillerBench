service: review

vars:
  SERVICE_NAME: review

# Path-scoped permissions. Framework-managed files (steps.yaml, SPEC.yaml,
# .runner/**) are auto-denied by the runner.
scope:
  - services/review/**

steps:
  - id: scaffold_directories
    do: python3 framework/scripts/scaffold_from_spec services/review/SPEC.yaml
    checks:
      - file_organization_matches_spec services/review/SPEC.yaml

  - id: implement_service
    context:
      - services/review/SPEC.yaml
    checks:
      - go_tests_pass services/review
      - docker_runs services/review
