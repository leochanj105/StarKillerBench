service: user

vars:
  SERVICE_NAME: user

# Path-scoped permissions. Framework-managed files (steps.yaml, SPEC.yaml,
# .runner/**) are auto-denied by the runner.
scope:
  - services/user/**

steps:
  - id: scaffold_directories
    do: python3 framework/scripts/scaffold_from_spec services/user/SPEC.yaml
    checks:
      - file_organization_matches_spec services/user/SPEC.yaml

  - id: implement_service
    context:
      - services/user/SPEC.yaml
    checks:
      - go_tests_pass services/user
      - docker_runs services/user
