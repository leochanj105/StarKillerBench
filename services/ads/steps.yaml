service: ads

vars:
  SERVICE_NAME: ads

# Path-scoped permissions. Framework-managed files (steps.yaml, SPEC.yaml,
# .runner/**) are auto-denied by the runner.
scope:
  - services/ads/**

steps:
  - id: scaffold_directories
    do: python3 framework/scripts/scaffold_from_spec services/ads/SPEC.yaml
    checks:
      - file_organization_matches_spec services/ads/SPEC.yaml

  - id: implement_service
    context:
      - services/ads/SPEC.yaml
    checks:
      - go_tests_pass services/ads
      - docker_runs services/ads
