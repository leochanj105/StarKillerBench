service: booking

vars:
  SERVICE_NAME: booking

scope:
  - services/booking/**

steps:
  - id: scaffold_directories
    do: python3 framework/scripts/scaffold_from_spec services/booking/SPEC.yaml
    checks:
      - file_organization_matches_spec services/booking/SPEC.yaml

  - id: implement_service
    context:
      - services/booking/SPEC.yaml
    checks:
      - go_tests_pass services/booking
      - docker_runs services/booking
