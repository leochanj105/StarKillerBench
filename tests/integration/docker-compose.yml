# Brings up all four services on a default compose network so each container
# can reach its dependencies via service-name DNS (matching the env-var
# defaults baked into each cmd/main.go). Tests run on the host and connect
# via host-published gRPC ports.

services:
  # Postgres backing for inventory v2. Schema is applied via the
  # docker-entrypoint-initdb.d hook so it's ready before the first
  # inventory query. Host port 15432 lets v2 unit tests on the host
  # also point at this same DB via PG_DSN.
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: inv
      POSTGRES_USER: inv
      POSTGRES_DB: inventory
    ports:
      - "15432:5432"
    volumes:
      - ../../services/inventory/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inv -d inventory"]
      interval: 1s
      timeout: 3s
      retries: 30

  payment:
    build:
      context: ../../services/payment
    container_name: payment
    ports:
      - "18101:50051"
      - "18801:8080"

  inventory:
    build:
      context: ../../services/inventory
    container_name: inventory
    environment:
      PG_DSN: postgres://inv:inv@postgres:5432/inventory?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18102:50051"
      - "18802:8080"

  booking:
    build:
      context: ../..
      dockerfile: services/booking/Dockerfile
    container_name: booking
    depends_on: [payment, inventory]
    ports:
      - "18103:50051"
      - "18803:8080"

  cancellation:
    build:
      context: ../..
      dockerfile: services/cancellation/Dockerfile
    container_name: cancellation
    depends_on: [booking, payment]
    ports:
      - "18104:50051"
      - "18804:8080"
